<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Read Kids Stories Online | Kids Park</title>

    <meta name="description"
        content="Read fun and entertaining kids stories online at Kids Park. Enjoy animal stories, moral stories, bedtime stories, funny stories, adventure stories and princess stories for children.">

    <meta name="keywords"
        content="read kids stories online, kids stories, children's stories, bedtime stories for kids, moral stories for kids, animal stories for kids, funny stories for kids, adventure stories for kids, princess stories for kids, Kids Park">

    <meta name="robots" content="index, follow">

    <meta name="author" content="Kids Park">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

<header class="header">
    <div class="container header-content">
        <a href="index.html" class="logo">🐣 Kids Park</a>

        <nav class="navbar" id="mainNavbar">
            <a href="index.html#home"> Home</a>
            <a href="index.html#stories">Stories</a>
            <a href="index.html#categories"> Categories</a>
            <a href="learning.html">Learning</a>
        </nav>

        <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>
</header>

<main class="story-page">
    <div class="container">
        <a href="index.html#stories" class="back-button">
            <i class="fa-solid fa-arrow-left"></i> Back to Stories
        </a>

        <article class="story-reader">
            <header class="story-header">
                <div class="story-big-emoji" id="storyEmoji">📖</div>
                <h1 id="storyTitle">Story</h1>
                <p id="storyCategory">📚 Kids Story</p>
            </header>

            <div class="audio-controls">
                <button id="listenButton" class="listen-button" type="button">
                    <i class="fa-solid fa-volume-high"></i> Listen
                </button>

                <button id="stopButton" class="stop-button" type="button">
                    <i class="fa-solid fa-stop"></i> Stop
                </button>
            </div>

            <div id="storyText" class="story-text" aria-live="polite"></div>
        </article>
    </div>
</main>

<section class="suggested-stories">
    <div class="container">

        <div class="suggested-header">
            <h2>You May Also Like 📚</h2>
            <p>More fun stories for you!</p>
        </div>

        <div class="suggested-grid" id="suggestedStories">
            <!-- Stories added by JavaScript -->
        </div>

    </div>
</section>

<footer>
    <div class="container footer-content">
        <div class="logo">🐣 Kids Park</div>
        <p>© <span id="year"></span> Kids Park</p>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
