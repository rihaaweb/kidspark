<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>Food for Kids - Learn Food Names | Kids Park</title>

<meta name="description"
    content="Learn about different foods with Kids Park. Explore food names, pictures and fun learning activities designed to help children discover different types of food.">

<meta name="keywords"
    content="food for kids, learn food, food names for kids, foods with pictures, types of food for kids, food learning, kids food, healthy food for kids, Kids Park">

<meta name="robots" content="index, follow">

<meta name="author" content="Kids Park">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        i {
            color: white;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8e7;
            color: #333;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        /* ================= PAGE TITLE ================= */

        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-title h2 {
            font-size: 32px;
            color: #263746;
        }

        .page-title p {
            margin-top: 8px;
            font-size: 16px;
        }

        /* ================= SEARCH ================= */

        .search-box {
            max-width: 500px;
            margin: 0 auto 35px;
        }

        .search-box input {
            width: 100%;
            padding: 13px 18px;

            border: 2px solid #ddd;
            border-radius: 30px;

            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #ff7043;
        }

        /* ================= FOOD GRID ================= */

        .food-grid {
            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 20px;
        }

        /* ================= FOOD CARD ================= */

        .food-card {
            background: white;

            padding: 20px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.10);

            transition: 0.3s;
        }

        .food-card:hover {
            transform: translateY(-6px);
        }

        /* ================= EMOJI ================= */

        .food-emoji {
            font-size: 65px;

            min-height: 85px;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        /* ================= FOOD NAME ================= */

        .food-card h3 {
            margin: 12px 0;

            font-size: 20px;

            color: #333;
        }

        /* ================= VOICE BUTTON ================= */

        .voice-btn {
            border: none;

            background: #ff7043;

            color: white;

            padding: 9px 16px;

            border-radius: 25px;

            cursor: pointer;

            font-size: 14px;

            transition: 0.2s;
        }

        .voice-btn:hover {
            background: #e64a19;
        }

        /* ================= NO RESULT ================= */

        .no-result {
            grid-column: 1 / -1;

            text-align: center;

            padding: 40px 20px;

            font-size: 18px;

            color: #777;
        }

        /* ================= BACK BUTTON ================= */

        .back-button {
            display: block;

            width: fit-content;

            margin: 40px auto 0;

            background: #ff7043;

            color: white;

            text-decoration: none;

            padding: 11px 25px;

            border-radius: 25px;

            font-weight: bold;
        }

        .back-button:hover {
            background: #e64a19;
        }

        /* ================= FOOTER ================= */

        footer {
            margin-top: 50px;

            background: #263746;

            color: white;

            text-align: center;

            padding: 25px;
        }

        /* ================= TABLET ================= */

        @media (max-width: 1000px) {

            .food-grid {
                grid-template-columns: repeat(4, 1fr);
            }

        }

        @media (max-width: 800px) {

            .food-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .container {
                width: 94%;
            }

            .page-title h2 {
                font-size: 26px;
            }

            .page-title p {
                font-size: 14px;
            }

            .food-grid {
                grid-template-columns: repeat(2, 1fr);

                gap: 12px;
            }

            .food-card {
                padding: 12px;

                border-radius: 16px;
            }

            .food-emoji {
                font-size: 50px;

                min-height: 65px;
            }

            .food-card h3 {
                font-size: 16px;
            }

            .voice-btn {
                font-size: 12px;

                padding: 7px 11px;
            }

        }

    </style>

</head>


<body>


<!-- ================= MAIN ================= -->

<main class="container">


    <!-- ================= PAGE TITLE ================= -->

    <div class="page-title">

        <h2>🍎 Learn Foods</h2>

        <p>
            Learn different foods with fun emojis and English pronunciation.
        </p>

    </div>


    <!-- ================= SEARCH ================= -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search food..."
            oninput="searchFoods()"
        >

    </div>


    <!-- ================= FOOD GRID ================= -->

    <div
        class="food-grid"
        id="foodGrid"
    ></div>


    <!-- ================= BACK ================= -->

    <a
        href="../learning.html"
        class="back-button"
    >
        ← Back to Home
    </a>


</main>


<!-- ================= FOOTER ================= -->

<footer>

    <p>
        🐣 Kids Learning • Learn and Have Fun!
    </p>

</footer>


<!-- ================= JAVASCRIPT ================= -->

    },

    },

    },

    },

    },

    },

    {

    },

    {

    },

    }

/* ==================================================
   GET FOOD GRID
================================================== */

const foodGrid =
    document.getElementById("foodGrid");


/* ==================================================
   SHOW FOODS
================================================== */

function showFoods(list) {

    foodGrid.innerHTML = "";


    /* No results */

    if (list.length === 0) {

        foodGrid.innerHTML = `

            <div class="no-result">

                😕 No food found.

            </div>

        `;

        return;
    }


    /* Create cards */

    list.forEach(function(food) {


        const card =
            document.createElement("div");


        card.className =
            "food-card";


        card.innerHTML = `

            <div class="food-emoji">

                ${food.emoji}

            </div>

            <h3>
                ${food.name}
            </h3>

            <button
                class="voice-btn"
                onclick="speak('${food.name}')"
            >

                <i class="fa-solid fa-volume-high"></i>

                Listen

            </button>

        `;


        foodGrid.appendChild(card);

    });

}


/* ==================================================
   VOICE
================================================== */

function speak(text) {

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";

    speech.rate = 0.85;

    speech.pitch = 1;

    speech.volume = 1;

    speechSynthesis.speak(speech);

}


/* ==================================================
   SEARCH FOODS
================================================== */

function searchFoods() {

    const searchValue =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    const filteredFoods =
        foods.filter(function(food) {

            return food.name
                .toLowerCase()
                .includes(searchValue);

        });


    showFoods(filteredFoods);

}


/* ==================================================
   INITIAL LOAD
================================================== */

showFoods(foods);


</script>


</body>

</html>
