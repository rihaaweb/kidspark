<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shapes for Kids - Learn Basic Shapes | Kids Park</title>

<meta name="description"
    content="Learn basic shapes with Kids Park. Explore circles, squares, triangles, rectangles, stars and more through fun and simple shape learning activities for children.">

<meta name="keywords"
    content="shapes for kids, learn shapes, basic shapes for kids, shape names for kids, shapes with pictures, geometric shapes for kids, shape learning, Kids Park">

<meta name="robots" content="index, follow">

<meta name="author" content="Kids Park">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8e7;
            color: #263746;
        }

        .header {
            background: #263746;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
        }

        .container {
            max-width: 1200px;
            width: 92%;
            margin: 35px auto;
        }

        .back-button {
            display: inline-block;
            text-decoration: none;
            background: #ff7043;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .back-button:hover {
            background: #e64a19;
        }

        .search-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .search-box input {
            width: 100%;
            max-width: 550px;
            padding: 15px 18px;
            border: 2px solid #ff7043;
            border-radius: 30px;
            outline: none;
            font-size: 16px;
            background: white;
        }

        .shapes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }

        .shape-card {
            background: white;
            border-radius: 15px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.10);
            transition: 0.3s;
        }

        .shape-card:hover {
            transform: translateY(-6px);
        }

        .shape-emoji {
            font-size: 65px;
            margin-bottom: 15px;
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shape-card h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .listen-button {
            border: none;
            background: #ff7043;
            color: white;
            padding: 9px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .listen-button:hover {
            background: #e64a19;
        }

        .listen-button i {
            margin-right: 5px;
        }

        .no-result {
            display: none;
            text-align: center;
            font-size: 20px;
            padding: 40px;
        }

        footer {
            margin-top: 50px;
            background: #263746;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 1000px) {
            .shapes-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 750px) {
            .shapes-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 550px) {

            .header h1 {
                font-size: 26px;
            }

            .shapes-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .shape-card {
                padding: 20px 10px;
            }

            .shape-emoji {
                font-size: 50px;
            }

            .shape-card h2 {
                font-size: 16px;
            }

            .listen-button {
                font-size: 12px;
                padding: 8px 12px;
            }
        }

    </style>
</head>

<body>

    <header class="header">
        <h1>🔷 Learn Shapes</h1>
        <p>Learn different shapes and have fun! 🌈</p>
    </header>

    <div class="container">

        <a href="../learning.html" class="back-button">
            ← Back to Home
        </a>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search shape..."
                onkeyup="searchShapes()">
        </div>

        <div class="shapes-grid" id="shapesGrid"></div>

        <div class="no-result" id="noResult">
            😔 No shapes found!
        </div>

    </div>

    <footer>
        🐣 Kids Learning • Learn and Have Fun!
    </footer>


    <script>

        const shapes = [

            { name: "Circle", emoji: "🔵" },
            { name: "Square", emoji: "🟥" },
            { name: "Triangle", emoji: "🔺" },
            { name: "Diamond", emoji: "🔷" },
            { name: "Star", emoji: "⭐" },

            { name: "Heart", emoji: "❤️" },
            { name: "Rectangle", emoji: "▭" },
            { name: "Oval", emoji: "🥚" },
            { name: "Pentagon", emoji: "⬟" },
            { name: "Hexagon", emoji: "⬢" },

            { name: "Heptagon", emoji: "🛑" },
            { name: "Octagon", emoji: "🛑" },
            { name: "Nonagon", emoji: "🔵" },
            { name: "Decagon", emoji: "🔟" },
            { name: "Semicircle", emoji: "◓" },

            { name: "Crescent", emoji: "🌙" },
            { name: "Cross", emoji: "✚" },
            { name: "Plus", emoji: "➕" },
            { name: "Minus", emoji: "➖" },
            { name: "Arrow", emoji: "➡️" },

            { name: "Right Arrow", emoji: "➡️" },
            { name: "Left Arrow", emoji: "⬅️" },
            { name: "Up Arrow", emoji: "⬆️" },
            { name: "Down Arrow", emoji: "⬇️" },
            { name: "Diamond Shape", emoji: "🔶" },

            { name: "Circle Shape", emoji: "🟠" },
            { name: "Square Shape", emoji: "🟩" },
            { name: "Triangle Shape", emoji: "🔻" },
            { name: "Rectangle Shape", emoji: "▭" },
            { name: "Star Shape", emoji: "🌟" },

            { name: "Cloud Shape", emoji: "☁️" },
            { name: "Sun Shape", emoji: "☀️" },
            { name: "Moon Shape", emoji: "🌙" },
            { name: "Flower Shape", emoji: "🌸" },
            { name: "Sparkle", emoji: "✨" },

            { name: "Check Mark", emoji: "✅" },
            { name: "X Shape", emoji: "❌" },
            { name: "Exclamation Shape", emoji: "❗" },
            { name: "Question Shape", emoji: "❓" },
            { name: "Infinity Shape", emoji: "♾️" }

        ];


        function showShapes(list = shapes) {

            const grid = document.getElementById("shapesGrid");
            const noResult = document.getElementById("noResult");

            grid.innerHTML = "";

            if (list.length === 0) {
                noResult.style.display = "block";
                return;
            }

            noResult.style.display = "none";

            list.forEach(shape => {

                const card = document.createElement("div");

                card.className = "shape-card";

                card.innerHTML = `

                    <div class="shape-emoji">
                        ${shape.emoji}
                    </div>

                    <h2>${shape.name}</h2>

                    <button
                        class="listen-button"
                        onclick="speak('${shape.name}')">

                        <i class="fa-solid fa-volume-high"></i>
                        Listen

                    </button>

                `;

                grid.appendChild(card);

            });

        }


        function searchShapes() {

            const searchText =
                document.getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();

            const filteredShapes = shapes.filter(shape =>
                shape.name.toLowerCase().includes(searchText)
            );

            showShapes(filteredShapes);

        }


        function speak(text) {

            speechSynthesis.cancel();

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "en-US";
            speech.rate = 0.85;
            speech.pitch = 1;
            speech.volume = 1;

            speechSynthesis.speak(speech);

        }


        showShapes();

    </script>

</body>

</html>
