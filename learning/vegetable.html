<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vegetables for Kids - Learn Vegetable Names | Kids Park</title>

<meta name="description"
    content="Learn about different vegetables with Kids Park. Discover vegetable names, pictures and fun learning activities to help children recognize and learn about vegetables.">

<meta name="keywords"
    content="vegetables for kids, learn vegetables, vegetable names for kids, vegetables with pictures, types of vegetables for kids, vegetable learning, healthy vegetables for kids, Kids Park">

<meta name="robots" content="index, follow">

<meta name="author" content="Kids Park">

 <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>
<link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        i{
            color: white;
        }


        body {
            font-family: Arial, sans-serif;
            background: #fff8e7;
            color: #333;
        }


        

        /* ================= CONTAINER ================= */

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }


        /* ================= PAGE TITLE ================= */

        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }


        .page-title h2 {
            font-size: 32px;
            color: #263746;
        }


        .page-title p {
            margin-top: 8px;
            font-size: 16px;
        }


        /* ================= SEARCH ================= */

        .search-box {
            max-width: 500px;
            margin: 0 auto 35px;
        }


        .search-box input {
            width: 100%;
            padding: 13px 18px;

            border: 2px solid #ddd;
            border-radius: 30px;

            font-size: 16px;
            outline: none;
        }


        .search-box input:focus {
            border-color: #ff7043;
        }


        /* ================= ANIMAL GRID ================= */

        .animals-grid {
            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 20px;
        }


        /* ================= ANIMAL CARD ================= */

        .animal-card {
            background: white;

            padding: 18px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 5px 15px rgba(0,0,0,0.10);

            transition: 0.3s;
        }


        .animal-card:hover {
            transform: translateY(-6px);
        }


        .animal-card img {
            width: 140px;
            height: 140px;

            object-fit: contain;

            display: block;

            margin: auto;
        }


        .animal-card h3 {
            margin: 12px 0;

            font-size: 20px;

            color: #333;
        }


        /* ================= VOICE BUTTON ================= */

        .voice-btn {
            border: none;

            background: #ff7043;

            color: white;

            padding: 9px 16px;

            border-radius: 25px;

            cursor: pointer;

            font-size: 14px;

            transition: 0.2s;
        }


        .voice-btn:hover {
            background: #e64a19;
        }


        /* ================= NO RESULT ================= */

        .no-result {
            grid-column: 1 / -1;

            text-align: center;

            padding: 40px 20px;

            font-size: 18px;

            color: #777;
        }


        /* ================= BACK BUTTON ================= */

        .back-button {
            display: block;

            width: fit-content;

            margin: 40px auto 0;

            background: #ff7043;

            color: white;

            text-decoration: none;

            padding: 11px 25px;

            border-radius: 25px;

            font-weight: bold;
        }


        .back-button:hover {
            background: #e64a19;
        }


        /* ================= FOOTER ================= */

        footer {
            margin-top: 50px;

            background: #263746;

            color: white;

            text-align: center;

            padding: 25px;
        }


        /* ================= TABLET ================= */

        @media (max-width: 1000px) {

            .animals-grid {
                grid-template-columns: repeat(4, 1fr);
            }

        }


        @media (max-width: 800px) {

            .animals-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            header h1 {
                font-size: 28px;
            }


            header p {
                font-size: 15px;
            }


            nav a {
                margin: 0 6px;
                font-size: 14px;
            }


            .container {
                width: 94%;
            }


            .page-title h2 {
                font-size: 26px;
            }


            .animals-grid {
                grid-template-columns: repeat(2, 1fr);

                gap: 12px;
            }


            .animal-card {
                padding: 10px;

                border-radius: 16px;
            }


            .animal-card img {
                width: 105px;
                height: 105px;
            }


            .animal-card h3 {
                font-size: 16px;
            }


            .voice-btn {
                font-size: 12px;

                padding: 7px 11px;
            }

        }


    </style>

</head>


<body>






<!-- ================= MAIN ================= -->

<main class="container">


    <!-- ================= PAGE TITLE ================= -->

    <div class="page-title">

       <h2>🥕 Learn Vegetables</h2>

<p>
    Click the Listen button to hear the vegetable name.
</p>

    </div>



    <!-- ================= SEARCH ================= -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search animal..."
            oninput="searchAnimals()"
        >

    </div>



    <!-- ================= ANIMAL GRID ================= -->

    <div
        class="animals-grid"
        id="animalGrid"
    ></div>



    <!-- ================= BACK ================= -->

    <a
        href="../learning.html"
        class="back-button"
    >
        ← Back to Home
    </a>


</main>



<!-- ================= FOOTER ================= -->

<footer>

    <p>
        🐣Kids Learning • Learn and Have Fun!
    </p>

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script>


/* ==================================================
   ANIMAL DATA
================================================== */


const animals = [

    {
        name: "Pumpkin",
        image: "../learning/vegetables/49.png"
    },

    {
        name: "Spinach",
       image: "../learning/vegetables/50.png"
    },

    {
        name: "Cauliflower",
          image: "../learning/vegetables/51.png"
    },

    {
        name: "Cabbage",
         image: "../learning/vegetables/52.png"
    },

    {
        name: "Eggplant",
        image: "../learning/vegetables/53.png"
    },

    {
        name: "Onion",
         image: "../learning/vegetables/54.png"
    },

    {
        name: "Tomato",
        image: "../learning/vegetables/55.png"
    },

    {
        name: "Potato",
         image: "../learning/vegetables/56.png"
    },

    {
        name: "Carrot",
        image: "../learning/vegetables/57.png"
    },

    {
        name: "Redchilli",
         image: "../learning/vegetables/58.png"
    },

    {
        name: "Curry Leaves",
         image: "../learning/vegetables/59.png"
    },

    {
        name: "Bitter Gourd",
         image: "../learning/vegetables/60.png"
    },

    {
        name: "Ladyfinger",
         image: "../learning/vegetables/61.png"
    },

    {
        name: "Ginger",
         image: "../learning/vegetables/62.png"
    },

    {
        name: "Radish",
         image: "../learning/vegetables/63.png"
    },

    {
        name: "Corn",
         image: "../learning/vegetables/64.png"
    },

    {
        name: "Peas",
         image: "../learning/vegetables/65.png"
    },

    {
        name: "Bellpepper",
        image: "../learning/vegetables/66.png"
    },

    {
        name: "Cucumber",
         image: "../learning/vegetables/67.png"
    },

    {
        name: "Broccoli",
         image: "../learning/vegetables/68.png"
    },

    {
        name: "Mint",
         image: "../learning/vegetables/69.png"
    },

    {
        name: "Sweet Potato",
         image: "../learning/vegetables/70.png"
    },

    {
        name: "Garlic",
         image: "../learning/vegetables/71.png"
    },

    {
        name: "Mushroom",
         image: "../learning/vegetables/72.png"
    },

     {
        name: "Capsicum",
         image: "../learning/vegetables/73.png"
    },

     {
        name: "Beetroot",
         image: "../learning/vegetables/74.png"
    },

     {
        name: "Green Chilli",
         image: "../learning/vegetables/75.png"
    },


];



/* ==================================================
   GET ANIMAL GRID
================================================== */


const animalGrid =
    document.getElementById("animalGrid");



/* ==================================================
   SHOW ANIMALS
================================================== */


function showAnimals(list) {

    animalGrid.innerHTML = "";


    /* No results */

    if (list.length === 0) {

        animalGrid.innerHTML = `
        
            <div class="no-result">
                😕 No animal found.
            </div>
            
        `;

        return;
    }



    /* Create cards */

    list.forEach(function(animal) {


        const card =
            document.createElement("div");


        card.className =
            "animal-card";


        card.innerHTML = `

            <img
                src="${animal.image}"
                alt="${animal.name}"
                loading="lazy"
            >

            <h3>
                ${animal.name}
            </h3>

            <button
                class="voice-btn"
                onclick="speak('${animal.name}')"
            >
                <i class="fa-solid fa-volume-high"></i> Listen
            </button>

        `;


        animalGrid.appendChild(card);

    });

}



/* ==================================================
   VOICE
================================================== */


function speak(text) {


    /* Stop previous voice */

    speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(text);


    /* English voice */

    speech.lang = "en-US";


    /* Speed */

    speech.rate = 0.85;


    /* Pitch */

    speech.pitch = 1;


    /* Volume */

    speech.volume = 1;


    /* Speak */

    speechSynthesis.speak(speech);

}



/* ==================================================
   SEARCH ANIMALS
================================================== */


function searchAnimals() {


    const searchValue =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    const filteredAnimals =
        animals.filter(function(animal) {


            return animal.name
                .toLowerCase()
                .includes(searchValue);


        });


    showAnimals(filteredAnimals);

}



/* ==================================================
   INITIAL LOAD
================================================== */


showAnimals(animals);


</script>


</body>

</html>
