<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Days of the Week for Kids - Learn Days | Kids Park</title>

<meta name="description"
    content="Learn the seven days of the week with Kids Park. Help children learn Monday, Tuesday, Wednesday, Thursday, Friday, Saturday and Sunday in a fun and simple way.">

<meta name="keywords"
    content="days of the week for kids, days for kids, learn days, days names, Monday Tuesday Wednesday Thursday Friday Saturday Sunday, days learning, Kids Park">

<meta name="robots" content="index, follow">

<meta name="author" content="Kids Park">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8e7;
            color: #263746;
        }

        .header {
            background: #263746;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
        }

        .container {
            max-width: 1200px;
            width: 92%;
            margin: 35px auto;
        }

        .back-button {
            display: inline-block;
            text-decoration: none;
            background: #ff7043;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .back-button:hover {
            background: #e64a19;
        }

        .search-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .search-box input {
            width: 100%;
            max-width: 550px;
            padding: 15px 18px;
            border: 2px solid #ff7043;
            border-radius: 30px;
            outline: none;
            font-size: 16px;
            background: white;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .day-card {
            background: white;
            border-radius: 15px;
            padding: 30px 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.10);
            transition: 0.3s;
        }

        .day-card:hover {
            transform: translateY(-6px);
        }

        .day-emoji {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .day-number {
            font-size: 14px;
            color: #777;
            margin-bottom: 8px;
        }

        .day-card h2 {
            font-size: 21px;
            margin-bottom: 15px;
        }

        .listen-button {
            border: none;
            background: #ff7043;
            color: white;
            padding: 9px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .listen-button:hover {
            background: #e64a19;
        }

        .listen-button i {
            margin-right: 5px;
        }

        .no-result {
            display: none;
            text-align: center;
            font-size: 20px;
            padding: 40px;
        }

        footer {
            margin-top: 50px;
            background: #263746;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 800px) {
            .days-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .days-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .header h1 {
                font-size: 26px;
            }

            .day-card {
                padding: 22px 10px;
            }

            .day-emoji {
                font-size: 52px;
            }

            .day-card h2 {
                font-size: 17px;
            }

            .listen-button {
                font-size: 12px;
                padding: 8px 12px;
            }
        }

    </style>
</head>

<body>

    <header class="header">
        <h1>📅 Learn Days</h1>
        <p>Learn the days of the week! 🌈</p>
    </header>

    <div class="container">

        <a href="../learning.html" class="back-button">
            ← Back to Home
        </a>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search day..."
                onkeyup="searchDays()">
        </div>

        <div class="days-grid" id="daysGrid"></div>

        <div class="no-result" id="noResult">
            😔 No day found!
        </div>

    </div>

    <footer>
        🐣 Kids Learning • Learn and Have Fun!
    </footer>


    <script>

        const days = [

            {
                name: "Monday",
                emoji: "🌞",
                number: "Day 1"
            },

            {
                name: "Tuesday",
                emoji: "🌻",
                number: "Day 2"
            },

            {
                name: "Wednesday",
                emoji: "🌈",
                number: "Day 3"
            },

            {
                name: "Thursday",
                emoji: "🌤️",
                number: "Day 4"
            },

            {
                name: "Friday",
                emoji: "⭐",
                number: "Day 5"
            },

            {
                name: "Saturday",
                emoji: "🎉",
                number: "Day 6"
            },

            {
                name: "Sunday",
                emoji: "☀️",
                number: "Day 7"
            }

        ];


        function showDays(list = days) {

            const grid = document.getElementById("daysGrid");
            const noResult = document.getElementById("noResult");

            grid.innerHTML = "";

            if (list.length === 0) {
                noResult.style.display = "block";
                return;
            }

            noResult.style.display = "none";

            list.forEach(day => {

                const card = document.createElement("div");

                card.className = "day-card";

                card.innerHTML = `

                    <div class="day-emoji">
                        ${day.emoji}
                    </div>

                    <div class="day-number">
                        ${day.number}
                    </div>

                    <h2>${day.name}</h2>

                    <button
                        class="listen-button"
                        onclick="speak('${day.name}')">

                        <i class="fa-solid fa-volume-high"></i>
                        Listen

                    </button>

                `;

                grid.appendChild(card);

            });

        }


        function searchDays() {

            const searchText =
                document.getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();

            const filteredDays = days.filter(day =>
                day.name.toLowerCase().includes(searchText)
            );

            showDays(filteredDays);

        }


        function speak(text) {

            speechSynthesis.cancel();

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "en-US";
            speech.rate = 0.85;
            speech.pitch = 1;
            speech.volume = 1;

            speechSynthesis.speak(speech);

        }


        showDays();

    </script>

</body>

</html>
