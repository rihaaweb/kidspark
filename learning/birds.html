<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birds for Kids - Learn About Birds | Kids Park</title>

    <meta name="description"
        content="Learn about different birds with Kids Park. Discover bird names, pictures and sounds in a fun and simple way for children to explore and learn.">

    <meta name="keywords"
        content="birds for kids, learn birds, bird names for kids, birds with pictures, bird sounds for kids, bird learning, types of birds for kids, kids birds, Kids Park">

    <meta name="robots" content="index, follow">

    <meta name="author" content="Kids Park">
 <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>
<link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        i{
            color: white;
        }


        body {
            font-family: Arial, sans-serif;
            background: #fff8e7;
            color: #333;
        }


        

        /* ================= CONTAINER ================= */

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }


        /* ================= PAGE TITLE ================= */

        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }


        .page-title h2 {
            font-size: 32px;
            color: #263746;
        }


        .page-title p {
            margin-top: 8px;
            font-size: 16px;
        }


        /* ================= SEARCH ================= */

        .search-box {
            max-width: 500px;
            margin: 0 auto 35px;
        }


        .search-box input {
            width: 100%;
            padding: 13px 18px;

            border: 2px solid #ddd;
            border-radius: 30px;

            font-size: 16px;
            outline: none;
        }


        .search-box input:focus {
            border-color: #ff7043;
        }


        /* ================= ANIMAL GRID ================= */

        .animals-grid {
            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 20px;
        }


        /* ================= ANIMAL CARD ================= */

        .animal-card {
            background: white;

            padding: 18px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 5px 15px rgba(0,0,0,0.10);

            transition: 0.3s;
        }


        .animal-card:hover {
            transform: translateY(-6px);
        }


        .animal-card img {
            width: 140px;
            height: 140px;

            object-fit: contain;

            display: block;

            margin: auto;
        }


        .animal-card h3 {
            margin: 12px 0;

            font-size: 20px;

            color: #333;
        }


        /* ================= VOICE BUTTON ================= */

        .voice-btn {
            border: none;

            background: #ff7043;

            color: white;

            padding: 9px 16px;

            border-radius: 25px;

            cursor: pointer;

            font-size: 14px;

            transition: 0.2s;
        }


        .voice-btn:hover {
            background: #e64a19;
        }


        /* ================= NO RESULT ================= */

        .no-result {
            grid-column: 1 / -1;

            text-align: center;

            padding: 40px 20px;

            font-size: 18px;

            color: #777;
        }


        /* ================= BACK BUTTON ================= */

        .back-button {
            display: block;

            width: fit-content;

            margin: 40px auto 0;

            background: #ff7043;

            color: white;

            text-decoration: none;

            padding: 11px 25px;

            border-radius: 25px;

            font-weight: bold;
        }


        .back-button:hover {
            background: #e64a19;
        }


        /* ================= FOOTER ================= */

        footer {
            margin-top: 50px;

            background: #263746;

            color: white;

            text-align: center;

            padding: 25px;
        }


        /* ================= TABLET ================= */

        @media (max-width: 1000px) {

            .animals-grid {
                grid-template-columns: repeat(4, 1fr);
            }

        }


        @media (max-width: 800px) {

            .animals-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            header h1 {
                font-size: 28px;
            }


            header p {
                font-size: 15px;
            }


            nav a {
                margin: 0 6px;
                font-size: 14px;
            }


            .container {
                width: 94%;
            }


            .page-title h2 {
                font-size: 26px;
            }


            .animals-grid {
                grid-template-columns: repeat(2, 1fr);

                gap: 12px;
            }


            .animal-card {
                padding: 10px;

                border-radius: 16px;
            }


            .animal-card img {
                width: 105px;
                height: 105px;
            }


            .animal-card h3 {
                font-size: 16px;
            }


            .voice-btn {
                font-size: 12px;

                padding: 7px 11px;
            }

        }


    </style>

</head>


<body>






<!-- ================= MAIN ================= -->

<main class="container">


    <!-- ================= PAGE TITLE ================= -->

    <div class="page-title">

       <h2>🐦 Learn Birds</h2>

<p>
    Click the Listen button to hear the bird name.
</p>

    </div>



    <!-- ================= SEARCH ================= -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search animal..."
            oninput="searchAnimals()"
        >

    </div>



    <!-- ================= ANIMAL GRID ================= -->

    <div
        class="animals-grid"
        id="animalGrid"
    ></div>



    <!-- ================= BACK ================= -->

    <a
        href="../learning.html"
        class="back-button"
    >
        ← Back to Home
    </a>


</main>



<!-- ================= FOOTER ================= -->

<footer>

    <p>
        🐣Kids Learning • Learn and Have Fun!
    </p>

</footer>



<!-- ================= JAVASCRIPT ================= -->

<script>


/* ==================================================
   ANIMAL DATA
================================================== */


const animals = [

    {
        name: "Rooster",
        image: "../learning/birds/29.png"
    },

    {
        name: "Dove",
        image: "../learning/birds/30.png"
    },

    {
        name: "Penguin",
         image: "../learning/birds/31.png"
    },

    {
        name: "King Fisher",
         image: "../learning/birds/32.png"
    },

    {
        name: "Swan",
         image: "../learning/birds/33.png"
    },

    {
        name: "Owl",
         image: "../learning/birds/34.png"
    },

    {
        name: "Eagle",
         image: "../learning/birds/35.png"
    },

    {
        name: "Pigeon",
         image: "../learning/birds/36.png"
    },

    {
        name: "Duck",
         image: "../learning/birds/37.png"
    },

    {
        name: "Hen",
         image: "../learning/birds/38.png"
    },

    {
        name: "Peacock",
         image: "../learning/birds/39.png"
    },

    {
        name: "Crow",
        image: "../learning/birds/40.png"
    },

    {
        name: "Sparrow",
         image: "../learning/birds/41.png"
    },

    {
        name: "Parrot",
         image: "../learning/birds/42.png"
    },

    {
        name: "Kiwi",
         image: "../learning/birds/43.png"
    },

    {
        name: "Turkey",
        image: "../learning/birds/44.png"
    },

    {
        name: "Goose",
         image: "../learning/birds/45.png"
    },

    {
        name: "Quail",
        image: "../learning/birds/46.png"
    },

    {
        name: "Pelican",
         image: "../learning/birds/47.png"
    },

    {
        name: "Flamingo",
        image: "../learning/birds/48.png"
    },


];



/* ==================================================
   GET ANIMAL GRID
================================================== */


const animalGrid =
    document.getElementById("animalGrid");



/* ==================================================
   SHOW ANIMALS
================================================== */


function showAnimals(list) {

    animalGrid.innerHTML = "";


    /* No results */

    if (list.length === 0) {

        animalGrid.innerHTML = `
        
            <div class="no-result">
                😕 No animal found.
            </div>
            
        `;

        return;
    }



    /* Create cards */

    list.forEach(function(animal) {


        const card =
            document.createElement("div");


        card.className =
            "animal-card";


        card.innerHTML = `

            <img
                src="${animal.image}"
                alt="${animal.name}"
                loading="lazy"
            >

            <h3>
                ${animal.name}
            </h3>

            <button
                class="voice-btn"
                onclick="speak('${animal.name}')"
            >
                <i class="fa-solid fa-volume-high"></i> Listen
            </button>

        `;


        animalGrid.appendChild(card);

    });

}



/* ==================================================
   VOICE
================================================== */


function speak(text) {


    /* Stop previous voice */

    speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(text);


    /* English voice */

    speech.lang = "en-US";


    /* Speed */

    speech.rate = 0.85;


    /* Pitch */

    speech.pitch = 1;


    /* Volume */

    speech.volume = 1;


    /* Speak */

    speechSynthesis.speak(speech);

}



/* ==================================================
   SEARCH ANIMALS
================================================== */


function searchAnimals() {


    const searchValue =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    const filteredAnimals =
        animals.filter(function(animal) {


            return animal.name
                .toLowerCase()
                .includes(searchValue);


        });


    showAnimals(filteredAnimals);

}



/* ==================================================
   INITIAL LOAD
================================================== */


showAnimals(animals);


</script>


</body>

</html>
