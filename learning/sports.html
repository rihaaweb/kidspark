<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sports for Kids - Learn About Sports | Kids Park</title>

<meta name="description"
    content="Learn about different sports with Kids Park. Discover football, cricket, basketball, tennis, swimming and more through fun and simple learning activities for children.">

<meta name="keywords"
    content="sports for kids, learn sports, sports names for kids, different sports for kids, sports with pictures, kids sports learning, football for kids, cricket for kids, Kids Park">

<meta name="robots" content="index, follow">

<meta name="author" content="Kids Park">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8e7;
            color: #263746;
        }

        .header {
            background: #263746;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
        }

        .container {
            max-width: 1200px;
            width: 92%;
            margin: 35px auto;
        }

        .back-button {
            display: inline-block;
            text-decoration: none;
            background: #ff7043;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .back-button:hover {
            background: #e64a19;
        }

        .search-box {
            margin-bottom: 30px;
            text-align: center;
        }

        .search-box input {
            width: 100%;
            max-width: 550px;
            padding: 15px 18px;
            border: 2px solid #ff7043;
            border-radius: 30px;
            outline: none;
            font-size: 16px;
            background: white;
        }

        .sports-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }

        .sport-card {
            background: white;
            border-radius: 15px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.10);
            transition: 0.3s;
        }

        .sport-card:hover {
            transform: translateY(-6px);
        }

        .sport-emoji {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .sport-card h2 {
            font-size: 19px;
            margin-bottom: 15px;
        }

        .listen-button {
            border: none;
            background: #ff7043;
            color: white;
            padding: 9px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .listen-button:hover {
            background: #e64a19;
        }

        .listen-button i {
            margin-right: 5px;
        }

        .no-result {
            text-align: center;
            font-size: 20px;
            padding: 40px;
            display: none;
        }

        footer {
            margin-top: 50px;
            background: #263746;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 1000px) {
            .sports-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 750px) {
            .sports-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 550px) {

            .header h1 {
                font-size: 26px;
            }

            .sports-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .sport-card {
                padding: 20px 10px;
            }

            .sport-emoji {
                font-size: 50px;
            }

            .sport-card h2 {
                font-size: 16px;
            }

            .listen-button {
                font-size: 12px;
                padding: 8px 12px;
            }
        }

    </style>
</head>

<body>

    <header class="header">
        <h1>⚽ Learn Sports</h1>
        <p>Learn different sports and have fun! 🏆</p>
    </header>

    <div class="container">

        <a href="../learning.html" class="back-button">
            ← Back to Home
        </a>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search sport..."
                onkeyup="searchSports()">
        </div>

        <div class="sports-grid" id="sportsGrid"></div>

        <div class="no-result" id="noResult">
            😔 No sports found!
        </div>

    </div>

    <footer>
        🐣 Kids Learning • Learn and Have Fun!
    </footer>


    <script>

        const sports = [

            { name: "Football", emoji: "⚽" },
            { name: "Basketball", emoji: "🏀" },
            { name: "Cricket", emoji: "🏏" },
            { name: "Tennis", emoji: "🎾" },
            { name: "Volleyball", emoji: "🏐" },

            { name: "Baseball", emoji: "⚾" },
            { name: "Golf", emoji: "⛳" },
            { name: "Boxing", emoji: "🥊" },
            { name: "Swimming", emoji: "🏊" },
            { name: "Cycling", emoji: "🚴" },

            { name: "Running", emoji: "🏃" },
            { name: "Badminton", emoji: "🏸" },
            { name: "Table Tennis", emoji: "🏓" },
            { name: "Hockey", emoji: "🏒" },
            { name: "Ice Hockey", emoji: "🏒" },

            { name: "Skiing", emoji: "⛷️" },
            { name: "Snowboarding", emoji: "🏂" },
            { name: "Surfing", emoji: "🏄" },
            { name: "Skateboarding", emoji: "🛹" },
            { name: "Rowing", emoji: "🚣" },

            { name: "Archery", emoji: "🏹" },
            { name: "Wrestling", emoji: "🤼" },
            { name: "Karate", emoji: "🥋" },
            { name: "Judo", emoji: "🥋" },
            { name: "Gymnastics", emoji: "🤸" },

            { name: "Horse Riding", emoji: "🏇" },
            { name: "Motor Racing", emoji: "🏎️" },
            { name: "Skating", emoji: "⛸️" },
            { name: "Diving", emoji: "🤿" },
            { name: "Rock Climbing", emoji: "🧗" },

            { name: "Fencing", emoji: "🤺" },
            { name: "Weightlifting", emoji: "🏋️" },
            { name: "Bowling", emoji: "🎳" },
            { name: "Darts", emoji: "🎯" },
            { name: "Billiards", emoji: "🎱" },

            { name: "Chess", emoji: "♟️" },
            { name: "Rugby", emoji: "🏉" },
            { name: "American Football", emoji: "🏈" },
            { name: "Handball", emoji: "🤾" },
            { name: "Triathlon", emoji: "🏊" }

        ];


        function showSports(list = sports) {

            const grid = document.getElementById("sportsGrid");
            const noResult = document.getElementById("noResult");

            grid.innerHTML = "";

            if (list.length === 0) {
                noResult.style.display = "block";
                return;
            }

            noResult.style.display = "none";

            list.forEach(sport => {

                const card = document.createElement("div");

                card.className = "sport-card";

                card.innerHTML = `

                    <div class="sport-emoji">
                        ${sport.emoji}
                    </div>

                    <h2>${sport.name}</h2>

                    <button
                        class="listen-button"
                        onclick="speak('${sport.name}')">

                        <i class="fa-solid fa-volume-high"></i>
                        Listen

                    </button>

                `;

                grid.appendChild(card);

            });

        }


        function searchSports() {

            const searchText =
                document.getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();

            const filteredSports = sports.filter(sport =>
                sport.name.toLowerCase().includes(searchText)
            );

            showSports(filteredSports);

        }


        function speak(text) {

            speechSynthesis.cancel();

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "en-US";
            speech.rate = 0.85;
            speech.pitch = 1;
            speech.volume = 1;

            speechSynthesis.speak(speech);

        }


        showSports();

    </script>

</body>

</html>
